name: Deploy E-commerce Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Lint and test backend
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ecommerce-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './ecommerce-server/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "No lint script found"
        continue-on-error: true

      - name: Run tests
        run: npm test || echo "No tests found"
        continue-on-error: true

  # Lint and test frontend
  frontend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ecommerce-client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './ecommerce-client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Linter check completed"
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test || echo "No tests found"
        continue-on-error: true

  # Security audit
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Backend security audit
        run: |
          cd ecommerce-server
          npm audit --production || true

      - name: Frontend security audit
        run: |
          cd ecommerce-client
          npm audit --production || true

  # Build and push Docker images
  build-docker:
    needs: [backend-lint-test, frontend-lint-test, security-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        continue-on-error: true

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ecommerce-server
          file: ./ecommerce-server/Dockerfile
          push: false
          tags: ecommerce-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ecommerce-client
          file: ./ecommerce-client/Dockerfile
          push: false
          tags: ecommerce-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to production (placeholder)
  deploy:
    needs: [build-docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          echo "Deployment step - configure with your deployment method"
          echo "Options: SSH to server, AWS ECS, Kubernetes, etc."
        # Add your deployment commands here
        # Example SSH deployment:
        # - name: Deploy via SSH
        #   uses: appleboy/ssh-action@v1.0.0
        #   with:
        #     host: ${{ secrets.SERVER_HOST }}
        #     username: ${{ secrets.SERVER_USER }}
        #     key: ${{ secrets.SSH_PRIVATE_KEY }}
        #     script: |
        #       cd /path/to/app
        #       git pull
        #       docker-compose down
        #       docker-compose up -d --build

      - name: Health check
        run: |
          echo "Health check - verify deployment"
          # curl -f https://yourdomain.com/api/health || exit 1
